MaintainerNotes: |
  Upstream-signature-only workflow: never fall back to another signing key.
  The0.6.5 build stays disabled because its checkout metadata/native paths
  differ from public-source Linux builds. Version0.6.6 passed two clean local
  Linux builds with different project/SDK/NDK paths and Git presence; both
  unsigned APKs are byte-identical and verify with the GitHub APK signature.
  Compile with build-tools36.1.0; sign upstream APKs with apksigner34.0.0.
  The existing release certificate is preserved. No private key is uploaded.
  This is local container validation, not official F-Droid server acceptance.
  Packaging request: https://gitlab.com/fdroid/rfp/-/work_items/4674
  Version0.6.7 has one local Linux build/signature check, with existing caches,
  and byte-identical native libraries to0.6.6; no new two-build proof is claimed.
  See docs/releases/0.6.7-verification.json and0.6.6-verification.json.

