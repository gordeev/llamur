      required
    commit: 6cfc0d2d011fa1680e3905a2da82eaa58f902421
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y python3 git
    gradle:
      - yes
    binary: https://github.com/gordeev/llamur/releases/download/v0.6.5/llamur-0.6.5-arm64-v8a.apk
    srclibs:
      - llamacpp@701fd25b3a55a90297dec0d925204b29084054c8
    prebuild:
      - $$SDK$$/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0"
        "cmake;3.31.6"
      - echo "d9eb9da824d9e247a352f570f01e1169e725b2954bca9e283a71786c59b59f9a  $$SDK$$/platforms/android-36/android.jar"
        | sha256sum -c -
      - mkdir -p ../third_party/llama.cpp && git -C "$$llamacpp$$" archive 701fd25b3a55a90297dec0d925204b29084054c8
        | tar -x -C ../third_party/llama.cpp
      - (cd .. && python3 scripts/prepare-cpu-variant.py f32-recurrent-long-attention-v2)
      - rm -f ../third_party/llama.cpp/docs/development/llama-star/idea-arch.key ../.tools/llama-long-attention-v2/docs/development/llama-star/idea-arch.key
    ndk: r28c
    gradleprops:
      - motoaiCpuVariant=f32-recurrent-long-attention-v2
      - motoaiCpuKleidiAI=false

